    function escapeHtml(str) {
      if (str === null || str === undefined) return "";
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function formatTanggalIndo(isoStr) {
      if (!isoStr) return "-";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "-";
      return d.toLocaleDateString("id-ID", {
        day: "2-digit",
        month: "short",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      }) + " WIB";
    }

    function toDatetimeLocalValue(isoStr) {
      if (!isoStr) return "";
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return "";
      const pad = (n) => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }

    function normalizeWaPhone(phone) {
      let clean = String(phone || "").replace(/[^0-9]/g, "");
      if (clean.startsWith("0")) {
        clean = "62" + clean.slice(1);
      } else if (clean.startsWith("8")) {
        clean = "62" + clean;
      }
      return clean;
    }

    function compileWaMessage(template, data) {
      const statusText = STATUS_META[data.statusSeleksi]?.label || data.statusSeleksi || "Menunggu Verifikasi";
      return String(template || "")
        .replace(/\{nama\}/g, data.namaLengkap || "")
        .replace(/\{tiket\}/g, data.ticketId || "")
        .replace(/\{pin\}/g, data.pin || "")
        .replace(/\{jalur\}/g, data.jalurPendaftaran || "")
        .replace(/\{status\}/g, statusText)
        .replace(/\{catatan\}/g, data.catatanAdmin || "-")
        .replace(/\{sekolah\}/g, state.config.namaSekolah || "Sekolah");
    }

    function showToast(message, type = "info") {
      const container = document.getElementById("toast-container");
      if (!container) return;
      const styles = {
        success: "bg-emerald-600 text-white border-emerald-500",
        error: "bg-rose-600 text-white border-rose-500",
        warning: "bg-amber-500 text-white border-amber-400",
        info: "bg-slate-900 text-white border-slate-700"
      };
      const toast = document.createElement("div");
      toast.className = `pointer-events-auto px-4 py-3 rounded-2xl shadow-float border text-sm font-medium flex items-center justify-between gap-3 transition-all duration-300 transform translate-y-0 opacity-100 ${styles[type] || styles.info}`;
      toast.innerHTML = `
        <span class="leading-snug">${escapeHtml(message)}</span>
        <button type="button" class="text-white/80 hover:text-white font-bold text-base leading-none">&times;</button>
      `;
      toast.querySelector("button").onclick = () => toast.remove();
      container.appendChild(toast);
      setTimeout(() => {
        toast.classList.add("opacity-0", "-translate-y-2");
        setTimeout(() => toast.remove(), 300);
      }, 4200);
    }

    function copyTextToClipboard(text, label = "Teks") {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => {
          showToast(`${label} (${text}) berhasil disalin!`, "success");
        }).catch(() => {
          showToast(`Salin manual: ${text}`, "info");

    }

    // Penghitung Mundur Real-Time + Logika Penguncian Otomatis
    function updateCountdownState() {
      const prevClosed = state.countdown.closed;
      const cfg = state.config;

      if (!cfg.statusBuka) {
        state.countdown = {
          closed: true,
          reason: "manual_closed",
          days: 0,
          hours: 0,
          minutes: 0,
          seconds: 0,
          urgent: false,
          hasDeadline: !!cfg.deadlinePendaftaran
        };
      } else if (cfg.deadlinePendaftaran) {
        const target = new Date(cfg.deadlinePendaftaran).getTime();
        const now = Date.now();
        const diff = target - now;

        if (!isNaN(target) && diff <= 0) {
          state.countdown = {
            closed: true,
            reason: "deadline_expired",
            days: 0,
            hours: 0,
            minutes: 0,
            seconds: 0,
            urgent: false,
            hasDeadline: true
          };
        } else if (!isNaN(target)) {
          const days = Math.floor(diff / (1000 * 60 * 60 * 24));
          const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
          const minutes = Math.floor((diff / (1000 * 60)) % 60);
          const seconds = Math.floor((diff / 1000) % 60);
          const urgent = diff <= 24 * 60 * 60 * 1000;
          state.countdown = {
            closed: false,
            reason: "open",
            days,
            hours,
            minutes,
            seconds,
            urgent,
            hasDeadline: true
          };
        } else {
          state.countdown = { closed: false, reason: "open", days: 0, hours: 0, minutes: 0, seconds: 0, urgent: false, hasDeadline: false };
        }
      } else {
        state.countdown = { closed: false, reason: "open", days: 0, hours: 0, minutes: 0, seconds: 0, urgent: false, hasDeadline: false };
      }

      updateLiveCountdownDom();

      // Jika transisi dari terbuka -> tertutup tepat saat deadline habis, langsung kunci layar pendaftaran
      if (!prevClosed && state.countdown.closed) {
        showToast("Waktu pendaftaran telah berakhir. Formulir pendaftaran dikunci otomatis.", "warning");

        if (state.activeTab === "daftar" || state.activeTab === "beranda") {

        }
      }
    }

    // 9. ROUTER HALAMAN UTAMA
    // =========================================================================
    function renderCurrentView() {
      const container = document.getElementById("app-view");
      if (!container) return;

      switch (state.activeTab) {
        case "beranda":
          container.innerHTML = renderBerandaView();
          updateLiveCountdownDom();
          break;
        case "daftar":
          container.innerHTML = renderDaftarView();
          break;
        case "lacak":
          container.innerHTML = renderLacakView();
          break;
        case "portal":
          container.innerHTML = renderPortalPesertaView();
          break;
        case "admin_dashboard":
          container.innerHTML = state.isAdmin ? renderAdminDashboardView() : renderBerandaView();
          break;
        case "admin_verifikasi":
          container.innerHTML = state.isAdmin ? renderAdminVerifikasiView() : renderBerandaView();
          break;
        case "admin_pengaturan":
          container.innerHTML = state.isAdmin ? renderAdminPengaturanView() : renderBerandaView();
          break;
        default:
          container.innerHTML = renderBerandaView();
      }
    }

    // =========================================================================
    // 10. VIEW 1: BERANDA, COUNTDOWN AUTO-CLOSE & INFO KUOTA REAL-TIME
    // =========================================================================
    function getQuotaStats() {
      const cfg = state.config;
      const countByJalur = (jalur) =>
        state.pendaftar.filter(
          (p) => p.jalurPendaftaran === jalur && p.statusSeleksi !== "tidak_lulus"
        ).length;

      const list = [
        {
          nama: "Zonasi",
          kuota: Number(cfg.kuotaZonasi) || 0,
          terisi: countByJalur("Zonasi"),
          gradient: "from-indigo-500 to-blue-600",
          barColor: "bg-indigo-600",
          lightBg: "bg-indigo-50 text-indigo-700",
          desc: "Seleksi berdasarkan jarak domisili sesuai Kartu Keluarga."
        },
        {
          nama: "Prestasi",
          kuota: Number(cfg.kuotaPrestasi) || 0,
          terisi: countByJalur("Prestasi"),
          gradient: "from-violet-500 to-purple-600",
          barColor: "bg-violet-600",
          lightBg: "bg-violet-50 text-violet-700",
          desc: "Nilai rapor unggulan & kejuaraan akademik/non-akademik."
        },
        {
          nama: "Afirmasi",
          kuota: Number(cfg.kuotaAfirmasi) || 0,
          terisi: countByJalur("Afirmasi"),
          gradient: "from-emerald-500 to-teal-600",
          barColor: "bg-emerald-600",
          lightBg: "bg-emerald-50 text-emerald-700",
          desc: "Diperuntukkan bagi keluarga ekonomi tidak mampu (KIP/PKH)."
        },
        {
          nama: "Mutasi",
          kuota: Number(cfg.kuotaMutasi) || 0,
          terisi: countByJalur("Mutasi"),
          gradient: "from-amber-500 to-orange-600",
          barColor: "bg-amber-500",
          lightBg: "bg-amber-50 text-amber-700",
          desc: "Perpindahan tugas orang tua/wali atau anak guru."
        }
      ];

      return list.map((item) => {
        const sisa = Math.max(0, item.kuota - item.terisi);
        const pct = item.kuota > 0 ? Math.min(100, Math.round((item.terisi / item.kuota) * 100)) : 0;
        return { ...item, sisa, pct };
      });
    }

    function generateTicketId() {
      const year = new Date().getFullYear();
      const nextNum = state.pendaftar.length + 1;
      const randSuffix = Math.floor(100 + Math.random() * 900);
      const candidate = `SPMB-${year}-${String(nextNum).padStart(3, "0")}`;
      if (state.pendaftar.some((p) => p.ticketId === candidate)) {
        return `SPMB-${year}-${randSuffix}${nextNum}`;
      }
      return candidate;
    }

    function generatePin6Digit() {
      return String(Math.floor(100000 + Math.random() * 900000));
    }

    window.handleSubmitPendaftaran = async function (e) {
      e.preventDefault();
      updateCountdownState();
      if (state.countdown.closed) {
        showToast("Maaf, waktu pendaftaran baru saja berakhir.", "error");
        renderCurrentView();
        return;
      }

      const form = e.target;
      const fd = new FormData(form);
      const nowIso = new Date().toISOString();
      const ticketId = generateTicketId();
      const pin = generatePin6Digit();
      const noWhatsapp = normalizeWaPhone(fd.get("noWhatsapp"));

      const newRecord = {
        ticketId,
        pin,
        namaLengkap: String(fd.get("namaLengkap") || "").trim(),
        nisn: String(fd.get("nisn") || "").trim(),
        jenisKelamin: String(fd.get("jenisKelamin") || "Laki-laki"),
        tempatTanggalLahir: String(fd.get("tempatTanggalLahir") || "").trim(),
        asalSekolah: String(fd.get("asalSekolah") || "").trim(),
        jalurPendaftaran: String(fd.get("jalurPendaftaran") || "Zonasi"),
        pilihanJurusan: String(fd.get("pilihanJurusan") || "").trim(),
        namaWali: String(fd.get("namaWali") || "").trim(),
        noWhatsapp,
        alamat: String(fd.get("alamat") || "").trim(),
        linkBerkas: String(fd.get("linkBerkas") || "").trim(),
        statusSeleksi: "menunggu",
        catatanAdmin: "Berkas diterima sistem, menunggu pemeriksaan panitia.",
        timeline: [
          {
            waktu: nowIso,
            judul: "Pendaftaran Online Diterima",
            deskripsi: `Formulir berhasil dikirim dengan nomor tiket ${ticketId}.`,
            status: "menunggu"
          }
        ],
        createdAt: nowIso,
        updatedAt: nowIso
      };

      const btn = document.getElementById("btn-submit-daftar");
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<span>Memproses Tiket...</span>`;
      }

      try {
        if (IS_PREVIEW) {
          state.pendaftar.unshift(newRecord);
        } else {
          await setDoc(doc(fbDb, "pendaftar", ticketId), newRecord);
        }

        state.trackedTicketId = ticketId;
        state.studentSession = newRecord;
        form.reset();
        showToast(`Pendaftaran berhasil! Nomor Tiket Anda: ${ticketId}`, "success");
        openTicketSuccessModal(newRecord);
      } catch (err) {
        console.error("Error simpan pendaftaran:", err);
        showToast("Gagal mengirim pendaftaran ke database. Periksa koneksi Anda.", "error");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `${ICONS.sparkles}<span>Kirim Pendaftaran & Terbitkan Tiket</span>`;
        }
      }
    };

    }

    window.handleStudentLogin = async function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const ticketInput = String(fd.get("ticketId") || "").trim().toUpperCase();
      const pinInput = String(fd.get("pin") || "").trim();

      let matched = null;

      if (IS_PREVIEW) {
        matched = state.pendaftar.find(
          (p) => p.ticketId.toUpperCase() === ticketInput && p.pin === pinInput
        );
      } else {
        try {
          const docRef = doc(fbDb, "pendaftar", ticketInput);
          const snap = await getDoc(docRef);
          if (snap.exists() && snap.data().pin === pinInput) {
            matched = { ticketId: snap.id, ...snap.data() };
          }
        } catch (err) {
          console.error("Login peserta error:", err);
          showToast("Terjadi gangguan koneksi saat memverifikasi tiket.", "error");
          return;
        }
      }

      if (!matched) {
        showToast("Nomor Tiket atau PIN 6 digit tidak sesuai.", "error");
        return;
      }

      state.studentSession = matched;
      showToast(`Selamat datang, ${matched.namaLengkap}!`, "success");
      renderCurrentView();
    };

    window.handleStudentLogout = function () {
      state.studentSession = null;
      renderCurrentView();
    };

    window.handleStudentUpdateData = async function (e) {
      e.preventDefault();
      if (!state.studentSession) return;
      const fd = new FormData(e.target);
      const nowIso = new Date().toISOString();
      const s = state.studentSession;

      const nextStatus = s.statusSeleksi === "perlu_perbaikan" ? "menunggu" : s.statusSeleksi;
      const updatedTimeline = [
        ...(s.timeline || []),
        {
          waktu: nowIso,
          judul: "Pembaruan Data oleh Peserta",
          deskripsi: "Calon murid memperbarui tautan berkas/kontak melalui Portal Peserta.",
          status: nextStatus
        }
      ];

      const patch = {
        noWhatsapp: normalizeWaPhone(fd.get("noWhatsapp")),
        asalSekolah: String(fd.get("asalSekolah") || "").trim(),
        linkBerkas: String(fd.get("linkBerkas") || "").trim(),
        statusSeleksi: nextStatus,
        timeline: updatedTimeline,
        updatedAt: nowIso
      };

      try {
        if (IS_PREVIEW) {
          const idx = state.pendaftar.findIndex((p) => p.ticketId === s.ticketId);
          if (idx !== -1) {
            state.pendaftar[idx] = { ...state.pendaftar[idx], ...patch };
            state.studentSession = state.pendaftar[idx];
          }
        } else {
          await updateDoc(doc(fbDb, "pendaftar", s.ticketId), patch);
        }
        showToast("Data & berkas berhasil diperbarui!", "success");
        renderCurrentView();
      } catch (err) {
        console.error("Update peserta gagal:", err);
        showToast("Gagal menyimpan perubahan data.", "error");
      }
    };

    window.refreshWaPreview = function (ticketId) {
      const p = state.pendaftar.find((item) => item.ticketId === ticketId);
      if (!p) return;
      const statusVal = document.getElementById("verif-status-select")?.value || p.statusSeleksi;
      const catatanVal = document.getElementById("verif-catatan-input")?.value || "";
      const waTextarea = document.getElementById("verif-wa-message");
      if (waTextarea) {
        waTextarea.value = compileWaMessage(state.config.templateWaUpdate, {
          ...p,
          statusSeleksi: statusVal,
          catatanAdmin: catatanVal
        });
      }
    };

    window.handleSaveVerification = async function (e, ticketId) {
      e.preventDefault();
      const submitter = e.submitter;
      const actionMode = submitter ? submitter.value : "save_only";

      const p = state.pendaftar.find((item) => item.ticketId === ticketId);
      if (!p) return;

      const statusSeleksi = document.getElementById("verif-status-select")?.value || p.statusSeleksi;
      const catatanAdmin = document.getElementById("verif-catatan-input")?.value.trim() || "";
      const waMessage = document.getElementById("verif-wa-message")?.value.trim() || "";
      const nowIso = new Date().toISOString();
      const statusLabel = STATUS_META[statusSeleksi]?.label || statusSeleksi;

      const updatedTimeline = [
        ...(p.timeline || []),
        {
          waktu: nowIso,
          judul: `Status Diperbarui: ${statusLabel}`,
          deskripsi: catatanAdmin || `Status seleksi ditetapkan menjadi ${statusLabel}.`,
          status: statusSeleksi
        }
      ];

      const patch = {
        statusSeleksi,
        catatanAdmin,
        timeline: updatedTimeline,
        updatedAt: nowIso
      };

      try {
        if (IS_PREVIEW) {
          const idx = state.pendaftar.findIndex((item) => item.ticketId === ticketId);
          if (idx !== -1) {
            state.pendaftar[idx] = { ...state.pendaftar[idx], ...patch };
          }
        } else {
          await updateDoc(doc(fbDb, "pendaftar", ticketId), patch);
        }

        if (actionMode === "save_and_wa") {
          await dispatchWhatsAppNotification(p, statusLabel, waMessage);
        } else {
          showToast(`Status ${p.namaLengkap} diperbarui menjadi ${statusLabel}.`, "success");
        }

        closeModal();
        renderCurrentView();
      } catch (err) {
        console.error("Verifikasi error:", err);
        showToast("Gagal menyimpan perubahan status verifikasi.", "error");
      }
    };

    async function dispatchWhatsAppNotification(pendaftarObj, kategoriNotif, isiPesan) {
      const phone = normalizeWaPhone(pendaftarObj.noWhatsapp);
      const nowIso = new Date().toISOString();
      let metodeKirim = "WhatsApp Web / Direct";

      // Jika Admin mengonfigurasi Webhook WA Gateway (misal Fonnte/Wablas)
      if (state.config.waGatewayEndpoint && state.config.waApiToken) {
        try {
          const res = await fetch(state.config.waGatewayEndpoint, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: state.config.waApiToken
            },
            body: JSON.stringify({
              target: phone,
              phone: phone,
              message: isiPesan
            })
          });
          if (res.ok) {
            metodeKirim = "WA Gateway API";
            showToast(`Notifikasi WA terkirim otomatis via Gateway ke ${pendaftarObj.namaLengkap}!`, "success");
          } else {
            throw new Error("Gateway response not OK");
          }
        } catch (err) {
          // Fallback aman ke WA Web jika browser memblokir CORS atau gateway offline
          metodeKirim = "WhatsApp Web (Fallback)";
          window.open(`https://wa.me/${phone}?text=${encodeURIComponent(isiPesan)}`, "_blank", "noopener,noreferrer");
          showToast("Membuka WhatsApp Web untuk mengirim pesan...", "info");
        }
      } else {
        window.open(`https://wa.me/${phone}?text=${encodeURIComponent(isiPesan)}`, "_blank", "noopener,noreferrer");
        showToast(`Status disimpan & membuka WhatsApp ke ${pendaftarObj.namaLengkap}.`, "success");
      }

      const logEntry = {
        ticketId: pendaftarObj.ticketId,
        namaPenerima: pendaftarObj.namaLengkap,
        noWhatsapp: phone,
        kategoriNotif,
        isiPesan,
        metodeKirim,
        waktuKirim: nowIso
      };

      if (IS_PREVIEW) {
        state.waLogs.unshift({ id: `log-${Date.now()}`, ...logEntry });
      } else {
        try {
          await addDoc(collection(fbDb, "log_notifikasi_wa"), logEntry);
        } catch (e) {
          console.error("Gagal mencatat log WA:", e);
        }
      }
    }

                  <input type="text" name="namaKetuaPanitia" value="${escapeHtml(cfg.namaKetuaPanitia)}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">NIP Ketua Panitia</label>
                  <input type="text" name="nipKetuaPanitia" value="${escapeHtml(cfg.nipKetuaPanitia)}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm" />
                </div>
              </div>
            </div>

            <!-- KARTU 2: PENGATURAN COUNTDOWN DEADLINE & AUTO-CLOSE -->
            <div class="glass-card rounded-3xl p-6 sm:p-7 shadow-glass space-y-5">
              <div class="flex items-center gap-3 pb-3 border-b border-slate-100">
                <div class="w-11 h-11 rounded-2xl bg-gradient-to-br from-amber-500 to-rose-600 text-white flex items-center justify-center shadow-md">
                  ${ICONS.clock}
                </div>
                <div>
                  <h3 class="font-display font-extrabold text-base text-slate-900">Jadwal Penghitung Mundur & Penguncian Otomatis</h3>
                  <p class="text-xs text-slate-500">Ketika waktu mencapai deadline di bawah, formulir pendaftaran otomatis tertutup.</p>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Saklar Status Pendaftaran</label>
                  <select name="statusBuka" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold">
                    <option value="true" ${cfg.statusBuka ? "selected" : ""}>DIBUKA (Mengikuti Countdown Deadline)</option>
                    <option value="false" ${!cfg.statusBuka ? "selected" : ""}>DITUTUP MANUAL SEKARANG</option>
                  </select>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Batas Akhir Pendaftaran (Deadline)</label>
                  <input type="datetime-local" id="settings-deadline-input" name="deadlinePendaftaran" value="${toDatetimeLocalValue(cfg.deadlinePendaftaran)}" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm" />
                  <div class="flex flex-wrap gap-1.5 mt-1.5">
                    <button type="button" onclick="window.setQuickDeadline(3)" class="px-2 py-0.5 rounded bg-indigo-50 text-indigo-700 text-[10px] font-bold hover:bg-indigo-100">+3 Hari</button>
                    <button type="button" onclick="window.setQuickDeadline(-1)" class="px-2 py-0.5 rounded bg-rose-50 text-rose-700 text-[10px] font-bold hover:bg-rose-100">Simulasikan Habis</button>
                  </div>
                </div>
                <div class="sm:col-span-2">
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Pesan Pengumuman Saat Pendaftaran Ditutup</label>
                  <textarea name="pesanTutup" rows="2" class="w-full px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm">${escapeHtml(cfg.pesanTutup)}</textarea>
                </div>
              </div>
            </div>

            <!-- KARTU 3: KUOTA PER JALUR -->
            <div class="glass-card rounded-3xl p-6 sm:p-7 shadow-glass space-y-4">
              <h3 class="font-display font-extrabold text-base text-slate-900">Daya Tampung / Kuota per Jalur</h3>
              <div class="grid grid-cols-2 sm:grid-cols-4 gap-4">
                <div>
                  <label class="block text-xs font-bold text-indigo-700 mb-1">Kuota Zonasi</label>
                  <input type="number" min="0" name="kuotaZonasi" value="${Number(cfg.kuotaZonasi) || 0}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-violet-700 mb-1">Kuota Prestasi</label>
                  <input type="number" min="0" name="kuotaPrestasi" value="${Number(cfg.kuotaPrestasi) || 0}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-emerald-700 mb-1">Kuota Afirmasi</label>
                  <input type="number" min="0" name="kuotaAfirmasi" value="${Number(cfg.kuotaAfirmasi) || 0}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-amber-700 mb-1">Kuota Mutasi</label>
                  <input type="number" min="0" name="kuotaMutasi" value="${Number(cfg.kuotaMutasi) || 0}" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-bold" />
                </div>
              </div>
            </div>

            <!-- KARTU 4: TEMPLATE & GATEWAY NOTIFIKASI WHATSAPP -->
            <div class="glass-card rounded-3xl p-6 sm:p-7 shadow-glass space-y-4">
              <div class="flex items-center gap-3 pb-2 border-b border-slate-100">
                <div class="w-10 h-10 rounded-2xl bg-emerald-500 text-white flex items-center justify-center shadow-sm">
                  ${ICONS.whatsapp}
                </div>
                <div>
                  <h3 class="font-display font-extrabold text-base text-slate-900">Template Pesan & Gateway WhatsApp</h3>
                  <p class="text-xs text-slate-500">Variabel didukung: <code>{nama}</code>, <code>{tiket}</code>, <code>{pin}</code>, <code>{jalur}</code>, <code>{status}</code>, <code>{catatan}</code>, <code>{sekolah}</code></p>
                </div>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Template WA Bukti Pendaftaran Baru</label>
                  <textarea name="templateWaDaftar" rows="4" class="w-full p-3 rounded-xl border border-slate-200 bg-white text-xs">${escapeHtml(cfg.templateWaDaftar)}</textarea>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Template WA Pembaruan Status Verifikasi</label>
                  <textarea name="templateWaUpdate" rows="4" class="w-full p-3 rounded-xl border border-slate-200 bg-white text-xs">${escapeHtml(cfg.templateWaUpdate)}</textarea>
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">Endpoint Webhook WA Gateway (Opsional)</label>
                  <input type="url" name="waGatewayEndpoint" value="${escapeHtml(cfg.waGatewayEndpoint)}" placeholder="https://api.fonnte.com/send" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs" />
                </div>
                <div>
                  <label class="block text-xs font-bold text-slate-700 mb-1.5">API Token WA Gateway (Opsional)</label>
                  <input type="text" name="waApiToken" value="${escapeHtml(cfg.waApiToken)}" placeholder="Token API Gateway Anda" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-200 bg-white text-xs" />
                </div>
              </div>
            </div>

            <div class="flex justify-end">
              <button type="submit" id="btn-save-settings" class="px-8 py-3.5 rounded-2xl bg-gradient-to-r from-indigo-600 to-sky-500 hover:from-indigo-700 hover:to-sky-600 text-white font-bold text-sm shadow-lg shadow-indigo-500/25 transition">
                Simpan Seluruh Pengaturan SPMB
              </button>
            </div>
          </form>
        </div>
      `;
    }

    // Kompresi otomatis file logo sekolah agar ringan disimpan di Firestore (< 100KB)
    window.handleLogoFileUpload = function (e) {
      const file = e.target.files && e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function (ev) {
        const rawResult = ev.target.result;
        if (file.type === "image/svg+xml") {
          tempUploadedLogoDataUrl = rawResult;
          updateLogoPreviewBox(rawResult);
          showToast("Logo SVG siap disimpan!", "success");
          return;
        }

        const img = new Image();
        img.onload = function () {
          const maxDim = 220;
          let w = img.width;
          let h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w > h) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          const compressed = canvas.toDataURL("image/png", 0.88);
          tempUploadedLogoDataUrl = compressed;
          updateLogoPreviewBox(compressed);
          showToast("Logo sekolah berhasil dioptimalkan & siap disimpan.", "success");
        };
        img.src = rawResult;
      };
      reader.readAsDataURL(file);
    };

    window.handleRemoveLogo = function () {
      tempUploadedLogoDataUrl = "";
      updateLogoPreviewBox("");
      showToast("Logo ditandai untuk dihapus. Klik Simpan Pengaturan.", "info");
    };

    function updateLogoPreviewBox(src) {
      const box = document.getElementById("settings-logo-preview");
      if (!box) return;
      box.innerHTML = src
        ? `<img src="${escapeHtml(src)}" alt="Pratinjau Logo" class="w-full h-full object-cover" />`
        : ICONS.school;
    }

    window.setQuickDeadline = function (daysOffset) {
      const input = document.getElementById("settings-deadline-input");
      if (!input) return;
      const target = new Date(Date.now() + daysOffset * 24 * 60 * 60 * 1000);
      input.value = toDatetimeLocalValue(target.toISOString());
    };

    window.handleSaveAdminSettings = async function (e) {
      e.preventDefault();
      const fd = new FormData(e.target);
      const rawDeadline = String(fd.get("deadlinePendaftaran") || "");
      const isoDeadline = rawDeadline ? new Date(rawDeadline).toISOString() : "";

      const finalLogo =
        tempUploadedLogoDataUrl !== null
          ? tempUploadedLogoDataUrl
          : state.config.logoSekolah;

      const updatedConfig = {
        logoSekolah: finalLogo,
        namaSekolah: String(fd.get("namaSekolah") || "").trim(),
        npsn: String(fd.get("npsn") || "").trim(),
        tagline: String(fd.get("tagline") || "").trim(),
        alamatSekolah: String(fd.get("alamatSekolah") || "").trim(),
        kontakPanitia: normalizeWaPhone(fd.get("kontakPanitia")),
        tahunAjaran: String(fd.get("tahunAjaran") || "").trim(),
        namaKetuaPanitia: String(fd.get("namaKetuaPanitia") || "").trim(),
        nipKetuaPanitia: String(fd.get("nipKetuaPanitia") || "").trim(),
        statusBuka: fd.get("statusBuka") === "true",
        deadlinePendaftaran: isoDeadline,
        pesanTutup: String(fd.get("pesanTutup") || "").trim(),
        kuotaZonasi: Math.max(0, Number(fd.get("kuotaZonasi")) || 0),
        kuotaPrestasi: Math.max(0, Number(fd.get("kuotaPrestasi")) || 0),
        kuotaAfirmasi: Math.max(0, Number(fd.get("kuotaAfirmasi")) || 0),
        kuotaMutasi: Math.max(0, Number(fd.get("kuotaMutasi")) || 0),
        templateWaDaftar: String(fd.get("templateWaDaftar") || ""),
        templateWaUpdate: String(fd.get("templateWaUpdate") || ""),
        waGatewayEndpoint: String(fd.get("waGatewayEndpoint") || "").trim(),
        waApiToken: String(fd.get("waApiToken") || "").trim()
      };

      const btn = document.getElementById("btn-save-settings");
      if (btn) {
        btn.disabled = true;
        btn.textContent = "Menyimpan...";
      }

      try {
        if (IS_PREVIEW) {
          state.config = updatedConfig;
        } else {
          await setDoc(doc(fbDb, "pengaturan_spmb", "config_utama"), updatedConfig, { merge: true });
          state.config = updatedConfig;
        }
        tempUploadedLogoDataUrl = null;
        updateCountdownState();
        renderChrome();
        renderCurrentView();
        showToast("Identitas sekolah, logo, jadwal, dan kuota berhasil disimpan!", "success");
      } catch (err) {
        console.error("Gagal simpan pengaturan:", err);
        showToast("Gagal menyimpan pengaturan ke Firestore.", "error");
      } finally {
        if (btn) {
          btn.disabled = false;
          btn.textContent = "Simpan Seluruh Pengaturan SPMB";
        }
      }
    };

    // =========================================================================
    // 18. MODAL HELPER & BOOTSTRAP AWAL
    // =========================================================================
    function openModal(htmlContent) {
      const modal = document.getElementById("modal-container");
      if (!modal) return;
      modal.innerHTML = htmlContent;
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    window.closeModal = function () {
      const modal = document.getElementById("modal-container");
      if (!modal) return;
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      modal.innerHTML = "";
    };

    // Tutup modal saat klik area backdrop gelap
    document.getElementById("modal-container")?.addEventListener("click", (e) => {
      if (e.target.id === "modal-container") {
        window.closeModal();
      }
    });

    // Render Perdana
    updateCountdownState();
    renderChrome();
    renderCurrentView();
  </script>
</body>
</html>
